# Render Infrastructure as Code Blueprint for PayPilot AI
# PayPal AI Hackathon — Render Sponsor Track

services:
  # 1. Backend Express API
  - type: web
    name: paypilot-api
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@paypilot/shared && npm run build --workspace=@paypilot/api
    startCommand: npm run start --workspace=@paypilot/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_API_BASE
        value: https://api.channel3.ai/v1

  # 2. Frontend React / Vite Static Site
  - type: web
    name: paypilot-web
    env: static
    buildCommand: npm install && npm run build --workspace=@paypilot/shared && npm run build --workspace=@paypilot/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: paypilot-api
          property: host

  # 3. Autonomous Price Sniper Background Cron Job (Module 6 Daemon)
  - type: cron
    name: buyward-price-sniper-cron
    env: node
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: npm install && npm run build --workspace=@paypilot/shared && npm run build --workspace=@paypilot/api
    startCommand: node -e "const base = (process.env.BACKEND_INTERNAL_URL ? ('https://' + process.env.BACKEND_INTERNAL_URL) : 'http://localhost:5000'); fetch(base + '/api/sniper/check-all').then(r => r.json()).then(d => console.log('[Sniper Daemon Cron] Triggered:', d)).catch(e => console.error('[Sniper Cron Error]', e.message));"
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: paypilot-api
          property: host
